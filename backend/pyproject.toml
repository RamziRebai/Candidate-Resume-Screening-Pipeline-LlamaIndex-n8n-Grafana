[project]
name = "candidate-resume-screening-backend"
version = "0.1.0"
description = "FastAPI backend for the candidate resume screening pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles==23.2.1",
    "fastapi==0.115.12",
    "google-api-python-client==2.187.0",
    "google-auth==2.40.3",
    "google-auth-httplib2==0.2.1",
    "google-auth-oauthlib==1.2.3",
    "httpx==0.28.1",
    "llama-cloud>=1.6.0,<2",
    "llama-index-core>=0.14.24,<0.15",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-embeddings-openai>=0.7.0,<0.8",
    "llama-index-llms-google-genai>=0.11.1",
    "llama-index-llms-openai>=0.8.1,<0.9",
    "llama-index-vector-stores-qdrant==0.9.2",
    "playwright==1.56.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.20",
    "qdrant-client==1.17.0",
    "typing-extensions==4.15.0",
    "uvicorn[standard]==0.34.3",
    "xhtml2pdf==0.2.17",
]

[tool.uv]
package = false
